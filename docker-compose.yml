services:
  postgres:
    image: postgres:15-alpine
    container_name: nura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nura_user
      POSTGRES_PASSWORD: secure_dev_password
      POSTGRES_DB: nura_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nura_user -d nura_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nura-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: nura-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nura-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://nura_user:secure_dev_password@postgres:5432/nura_db?schema=public"
      JWT_SECRET: "change-this-development-secret"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      QDRANT_URL: "http://qdrant:6333"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3000/api"
    container_name: nura-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3000/api"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  qdrantdata:
